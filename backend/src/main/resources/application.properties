spring.application.name=caipora-backend

# Le variaveis do arquivo backend/.env se ele existir (copie de .env.example)
spring.config.import=optional:file:.env[.properties]

# ===== Banco de dados (PostgreSQL) =====
# Valores padrao batem com o docker-compose.yml da raiz do projeto
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/caipora}
spring.datasource.username=${DB_USERNAME:caipora}
spring.datasource.password=${DB_PASSWORD:caipora}

# O schema e controlado pelo Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ===== Login com Google (OAuth2) =====
# Crie as credenciais em https://console.cloud.google.com/apis/credentials
# NUNCA coloque os valores reais aqui: use o arquivo .env
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:defina-no-env}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:defina-no-env}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
