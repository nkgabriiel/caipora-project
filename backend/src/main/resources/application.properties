spring.application.name=caipora-backend

# Le variaveis do arquivo backend/.env se ele existir (copie de .env.example)
spring.config.import=optional:file:.env[.properties]

# ===== Banco de dados (PostgreSQL) =====
# Valores padrao batem com o docker-compose.yml da raiz do projeto
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/caipora}
spring.datasource.username=${DB_USERNAME:caipora}
spring.datasource.password=${DB_PASSWORD:caipora}

# O schema e controlado pelo Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ===== Login com Google (OAuth2) =====
# Crie as credenciais em https://console.cloud.google.com/apis/credentials
# NUNCA coloque os valores reais aqui: use o arquivo .env
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:defina-no-env}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:defina-no-env}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ===== Erros da API =====
# Erros do Spring MVC (404, 405, validacao...) no formato padrao ProblemDetail (RFC 9457).
spring.mvc.problemdetails.enabled=true
# Detalhes internos (stack trace, mensagem da excecao) nunca vao para a resposta.
# Explicito de proposito: o DevTools liga essas opcoes ao rodar com spring-boot:run,
# e o erro chegava ao navegador com o stack trace inteiro (classes, porta do banco...).
# No Spring Boot 4 o prefixo e spring.web.error (o antigo server.error.* e ignorado).
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
